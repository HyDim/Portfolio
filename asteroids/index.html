<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Asteroids arcade game built with PixiJS v8 and TypeScript — particles, collision detection, screen effects." />
  <title>Asteroids // PixiJS v8</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #080d14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
    }
    #app canvas { display: block; border: 1px solid #1a2535; border-radius: 8px; }
    footer { color: #5a7084; font-size: 0.7rem; letter-spacing: 0.08em; }
    footer span { color: #00ff88; }
  </style>
</head>
<body>
  <div id="app"></div>
  <footer><span>&larr;&uarr;&rarr;</span>/WASD steer &middot; <span>SPACE</span> fire &middot; <span>ENTER</span> restart</footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
