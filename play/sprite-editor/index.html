<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sprite animation editor built with PixiJS v8 and TypeScript — spritesheet slicing, frame timeline, JSON export." />
  <title>Sprite Animation Editor // PixiJS v8</title>
  <style>
    :root {
      --bg: #080d14;
      --panel: #0d1520;
      --panel2: #101822;
      --border: #1a2535;
      --green: #00ff88;
      --cyan: #00d4ff;
      --orange: #ff6b35;
      --text: #c8d6e5;
      --dim: #5a7084;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.2rem; height: 48px; flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }
    header h1 { font-size: 0.8rem; letter-spacing: 0.2em; color: #fff; font-weight: 700; }
    header h1 span { color: var(--green); }
    header .meta { font-size: 0.65rem; color: var(--dim); letter-spacing: 0.1em; }

    main { flex: 1; display: flex; min-height: 0; }

    aside {
      background: var(--panel);
      overflow-y: auto;
      flex-shrink: 0;
    }
    #controls { width: 264px; border-right: 1px solid var(--border); padding: 1rem; }
    #timeline-panel { width: 196px; border-left: 1px solid var(--border); padding: 1rem; }

    .panel-section { margin-bottom: 1.4rem; }
    .panel-title {
      font-size: 0.62rem; letter-spacing: 0.18em; color: var(--green);
      text-transform: uppercase; margin-bottom: 0.7rem;
      padding-bottom: 0.4rem; border-bottom: 1px solid var(--border);
    }
    .field { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin-bottom: 0.55rem; }
    .field label { font-size: 0.68rem; color: var(--dim); letter-spacing: 0.04em; }
    .field input[type="number"] {
      width: 76px; padding: 0.3rem 0.45rem;
      background: var(--bg); color: var(--cyan);
      border: 1px solid var(--border); border-radius: 4px;
      font-family: var(--mono); font-size: 0.72rem;
    }
    .field input[type="number"]:focus { outline: none; border-color: var(--green); }
    .field input[type="color"] {
      width: 76px; height: 26px; padding: 2px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 4px; cursor: pointer;
    }
    .field input[type="checkbox"] { accent-color: var(--green); width: 15px; height: 15px; cursor: pointer; }
    .field input[type="range"] { flex: 1; accent-color: var(--green); cursor: pointer; }
    .field .range-value { width: 34px; text-align: right; color: var(--cyan); font-size: 0.72rem; }

    .btn-row { display: flex; gap: 0.45rem; }
    button {
      font-family: var(--mono); font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em;
      padding: 0.5rem 0.6rem; border-radius: 4px; cursor: pointer;
      background: rgba(0,255,136,0.08); color: var(--green);
      border: 1px solid rgba(0,255,136,0.35);
      transition: background 0.15s ease, box-shadow 0.15s ease;
    }
    button:hover { background: rgba(0,255,136,0.16); box-shadow: 0 0 10px rgba(0,255,136,0.15); }
    button.secondary { background: transparent; color: var(--dim); border-color: var(--border); }
    button.secondary:hover { color: var(--cyan); border-color: var(--cyan); box-shadow: none; }
    #btn-play { flex: 1; }

    .hint { font-size: 0.62rem; color: var(--dim); line-height: 1.7; }
    .hint b { color: var(--text); font-weight: 400; }

    #export-json {
      width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
      color: var(--cyan); font-family: var(--mono); font-size: 0.62rem; line-height: 1.6;
      padding: 0.6rem; white-space: pre; overflow-x: auto; margin-bottom: 0.6rem;
    }
    #btn-copy { width: 100%; }
    #btn-copy.copied { color: var(--bg); background: var(--green); }

    /* center stage */
    #stage-wrap {
      flex: 1; position: relative; min-width: 0;
      background: #10151d;
    }
    #stage-wrap.checker {
      background-image: repeating-conic-gradient(#222b36 0% 25%, #161d27 0% 50%);
      background-size: 24px 24px;
    }
    #stage-wrap canvas { position: absolute; inset: 0; }
    #stage-wrap.dragover::after {
      content: 'DROP PNG SPRITESHEET';
      position: absolute; inset: 12px; z-index: 5;
      display: flex; align-items: center; justify-content: center;
      border: 2px dashed var(--green); border-radius: 8px;
      background: rgba(8,13,20,0.7);
      color: var(--green); font-size: 0.8rem; letter-spacing: 0.2em; font-weight: 700;
      pointer-events: none;
    }
    #zoom-label {
      position: absolute; bottom: 10px; right: 14px; z-index: 4;
      font-size: 0.62rem; color: var(--dim); letter-spacing: 0.1em;
      background: rgba(8,13,20,0.7); padding: 0.2rem 0.5rem; border-radius: 4px;
      pointer-events: none;
    }
    #stage-hint {
      position: absolute; bottom: 10px; left: 14px; z-index: 4;
      font-size: 0.62rem; color: var(--dim); letter-spacing: 0.06em;
      background: rgba(8,13,20,0.7); padding: 0.2rem 0.5rem; border-radius: 4px;
      pointer-events: none;
    }

    /* timeline */
    #frames { display: flex; flex-direction: column; gap: 0.5rem; }
    .frame-thumb {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.35rem; border-radius: 4px;
      background: var(--panel2); border: 1px solid var(--border);
      cursor: pointer; text-align: left;
      font-weight: 400; letter-spacing: 0; color: var(--dim); font-size: 0.66rem;
      transition: border-color 0.12s ease;
    }
    .frame-thumb:hover { border-color: var(--cyan); box-shadow: none; background: var(--panel2); }
    .frame-thumb.active { border-color: var(--green); color: var(--green); background: rgba(0,255,136,0.05); }
    .frame-thumb.dragover { border-color: var(--orange); }
    .frame-thumb canvas {
      width: 44px; height: 44px; flex-shrink: 0;
      background: repeating-conic-gradient(#222b36 0% 25%, #161d27 0% 50%);
      background-size: 12px 12px;
      border-radius: 3px; image-rendering: pixelated;
    }
    .frame-thumb .sound-dot { color: var(--orange); margin-left: auto; font-size: 0.7rem; display: none; }
    .frame-thumb.has-sound .sound-dot { display: inline; }
  </style>
  <script type="module" crossorigin src="./assets/index-CC195n7Q.js"></script>
</head>
<body>
  <header>
    <h1>SPRITE<span>_</span>ANIMATION<span>_</span>EDITOR</h1>
    <div class="meta">pixijs v8 &middot; typescript &middot; in-house tooling</div>
  </header>
  <main>
    <aside id="controls"></aside>
    <section id="stage-wrap">
      <div id="stage-hint">drag &amp; drop a PNG spritesheet &middot; scroll to zoom</div>
      <div id="zoom-label">100%</div>
    </section>
    <aside id="timeline-panel"></aside>
  </main>
</body>
</html>
